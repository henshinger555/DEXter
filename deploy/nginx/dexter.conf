# nginx site for DEXter. Install as /etc/nginx/sites-available/dexter and
# replace dexter.example.com with your hostname. certbot adds the HTTPS block.

server {
    listen 80;
    listen [::]:80;
    server_name dexter.example.com;

    # Matches DEXTER_MAX_UPLOAD_BYTES (10 MiB) plus multipart overhead.
    client_max_body_size 11m;

    location /DEXter/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
